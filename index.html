const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFromPw(pw) {
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(DATA.salt), iterations: DATA.iter }, mat, 256);
  return new Uint8Array(bits);
}
async function open(rawKey) {
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.nonce) }, key, b64(DATA.ct));
  document.open(); document.write(new TextDecoder().decode(pt)); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  try {
    const raw = await keyFromPw(document.getElementById("pw").value);
    if (document.getElementById("rem").checked) {
      try { localStorage.setItem("roikey", JSON.stringify(
        { k: btoa(String.fromCharCode(...raw)), exp: Date.now() + 30 * 864e5 })); } catch (_) {}
    }
    await open(raw);
  } catch (_) { err.textContent = "That password didn't work — check with Michael."; }
});
(async () => {   // remembered key: straight in, silently fall back to the form
  try {
    const s = JSON.parse(localStorage.getItem("roikey") || "null");
    if (s && s.exp > Date.now()) await open(b64(s.k));
    else if (s) localStorage.removeItem("roikey");
  } catch (_) {}
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
